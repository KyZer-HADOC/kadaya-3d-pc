name: Build KADAYA setup.exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run mission catalog, progression, shop, settings, and camera checks
        run: dotnet run --project Kadaya.Tests/Kadaya.Tests.csproj -c Release

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish game (self-contained, win-x64)
        run: dotnet publish Kadaya.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -p:PublishReadyToRun=false -p:TieredCompilation=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Ensure SDL2 native runtime is beside Kadaya.exe
        shell: pwsh
        run: |
          $publishRoot = (Resolve-Path "publish").Path
          $sdl = Get-ChildItem -Path $publishRoot -Recurse -File -Filter "SDL2.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdl) { throw "SDL2.dll is missing from the published MonoGame runtime. Refusing to package a game that crashes on startup." }
          $destination = Join-Path $publishRoot "SDL2.dll"
          if ($sdl.FullName -ne $destination) { Copy-Item -LiteralPath $sdl.FullName -Destination $destination -Force }
          if ((Get-Item -LiteralPath $destination).Length -le 0) { throw "Published SDL2.dll is empty." }

      - name: Verify published game and audio content
        shell: pwsh
        run: |
          $expected = @(
            "publish/Kadaya.exe",
            "publish/Content/Audio/MainMenu_Music.xnb",
            "publish/Content/Audio/Reaper_Scythe_Attack.xnb",
            "publish/Content/Audio/Reaper_Transformation.xnb"
          )
          foreach ($relativePath in $expected) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Published output is missing required file: $relativePath"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Published output contains an empty file: $relativePath"
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build setup.exe
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: KADAYA-setup
          path: output/setup.exe

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/setup.exe

